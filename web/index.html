<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1a2c" />
    <title>Sixfold</title>
    <meta name="description" content="A creature card duel with the old handheld rules: collect original cards, build decks, duel the AI and explore the world. Plays offline." />
    <!-- three.js for the world test (web/world/world.js); must come before any module script. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    />
    <!-- data-integrity="none": Chrome ignores (and warns about) integrity on icons and wasm preloads. -->
    <link data-trunk rel="icon" type="image/svg+xml" href="favicon.svg" data-integrity="none" />
    <!-- Installable and playable offline: the manifest, its icons and sw.js (written by sw-manifest.sh). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="a11y.js" />
    <script src="a11y.js" defer></script>
    <!-- wasm-opt must know the wasm features rustc emits by default. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-integrity="none"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="copy-dir" href="world" />
  </head>
  <body>
    <script>
      // A game, not a page: iOS Safari ignores user-scalable=no, so stop its pinch zoom here.
      for (const t of ["gesturestart", "gesturechange"]) addEventListener(t, (e) => e.preventDefault(), { passive: false });
    </script>
    <script>
      // Offline play: register the service worker, and offer a reload when a
      // new version has installed (it waits until the player says so).
      if ("serviceWorker" in navigator) {
        addEventListener("load", async () => {
          // Reload only when the player asked for the new version (the first
          // install also changes the controller, and must not reload).
          let wanted = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (wanted) { wanted = false; location.reload(); }
          });
          const reg = await navigator.serviceWorker.register("sw.js").catch(() => null);
          if (!reg) return;
          const offer = (worker) => {
            if (document.querySelector(".update-toast")) return;
            const toast = document.createElement("div");
            toast.className = "update-toast";
            toast.setAttribute("role", "status");
            const [msg, ok, no] = document.documentElement.lang === "fr" ? ["Nouvelle version disponible", "Recharger", "Plus tard"] : ["New version available", "Reload", "Later"];
            toast.innerHTML = `<span>${msg}</span><button type="button" class="btn primary">${ok}</button><button type="button" class="btn ghost" >${no}</button>`;
            const [reload, later] = toast.querySelectorAll("button");
            reload.onclick = () => { wanted = true; worker.postMessage("skip-waiting"); };
            later.onclick = () => toast.remove();
            document.body.append(toast);
          };
          const watch = (worker) => worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) offer(worker);
          });
          if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
          if (reg.installing) watch(reg.installing);
          reg.addEventListener("updatefound", () => watch(reg.installing));
          // A long session still hears about a new deploy.
          setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
        });
      }
    </script>
  </body>
</html>
