<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1a2c" />
    <title>Sixfold</title>
    <meta name="description" content="A Hexon card duel with the old handheld rules: collect original cards, build decks, duel the AI and explore the world. Plays offline." />
    <!-- three.js for the world (web/world/world.js), shipped with the game (tools/vendor-three.sh)
         so it is precached for offline play; must come before any module script. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.min.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <link data-trunk rel="copy-dir" href="vendor" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap"
    />
    <!-- data-integrity="none": Chrome ignores (and warns about) integrity on icons and wasm preloads. -->
    <link data-trunk rel="icon" type="image/svg+xml" href="favicon.svg" data-integrity="none" />
    <!-- Installable and playable offline: the manifest, its icons and sw.js (written by sw-manifest.sh). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="a11y.js" />
    <script src="a11y.js" defer></script>
    <link data-trunk rel="copy-file" href="tilt.js" />
    <script src="tilt.js" defer></script>
    <!-- Booster key art (packs/<theme>.webp): precached with the app shell. -->
    <link data-trunk rel="copy-dir" href="packs" />
    <!-- wasm-opt must know the wasm features rustc emits by default. -->
    <!-- data-initializer: loader.js drives the loading screen (#loader) while the wasm downloads. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-integrity="none" data-initializer="loader.js"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <link data-trunk rel="css" href="style.css" />
    <!-- #100 prototypes: three directions for the kit, picked with ?kit=a|b|c. -->
    <link data-trunk rel="css" href="kits.css" />
    <script>document.documentElement.dataset.kit = new URLSearchParams(location.search).get("kit") ?? "a";</script>
    <link data-trunk rel="copy-dir" href="world" />
    <!-- Card illustrations, cards/<slug>.webp (see build.rs); cached on first use, never precached. -->
    <link data-trunk rel="copy-dir" href="cards" />
  </head>
  <body>
    <!-- The loading screen, before the game runs (loader.js fills it in and removes it). -->
    <div id="loader" class="loader" role="status">
      <p class="wordmark" aria-hidden="true">Sixfold</p>
      <div class="progress-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <p class="loader-msg"></p>
      <button type="button" class="btn primary" hidden></button>
    </div>
    <script>
      // A game, not a page: iOS Safari ignores user-scalable=no, so stop its pinch zoom here.
      for (const t of ["gesturestart", "gesturechange"]) addEventListener(t, (e) => e.preventDefault(), { passive: false });
    </script>
    <script>
      // Offline play: register the service worker, and offer a reload when a
      // new version has installed (it waits until the player says so).
      if ("serviceWorker" in navigator) {
        addEventListener("load", async () => {
          // Reload only when the player asked for the new version (the first
          // install also changes the controller, and must not reload).
          let wanted = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (wanted) { wanted = false; location.reload(); }
          });
          const reg = await navigator.serviceWorker.register("sw.js").catch(() => null);
          if (!reg) return;
          const offer = (worker) => {
            if (document.querySelector(".update-toast")) return;
            const toast = document.createElement("div");
            toast.className = "update-toast";
            toast.setAttribute("role", "status");
            // The app may not have set <html lang> yet: read the same choice it does.
            let fr = false;
            try { fr = (localStorage.getItem("sixfold.lang") ?? navigator.language).toLowerCase().startsWith("fr"); } catch {}
            const [msg, ok, no] = fr ? ["Nouvelle version disponible", "Recharger", "Plus tard"] : ["New version available", "Reload", "Later"];
            toast.innerHTML = `<span>${msg}</span><button type="button" class="btn primary">${ok}</button><button type="button" class="btn ghost" >${no}</button>`;
            const [reload, later] = toast.querySelectorAll("button");
            reload.onclick = () => { wanted = true; worker.postMessage("skip-waiting"); };
            later.onclick = () => toast.remove();
            document.body.append(toast);
          };
          const watch = (worker) => worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) offer(worker);
          });
          // Every region playable offline: once the app is up, the worker downloads
          // the rest of the world and reports {done, total} (shown in Settings).
          navigator.serviceWorker.addEventListener("message", (e) => {
            if (e.data?.type !== "fill") return;
            window.sixfoldOffline = e.data;
            dispatchEvent(new CustomEvent("sixfold-offline", { detail: e.data }));
          });
          navigator.serviceWorker.ready.then((r) =>
            (window.requestIdleCallback ?? setTimeout)(() => r.active?.postMessage({ type: "fill" })),
          );
          if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
          if (reg.installing) watch(reg.installing);
          reg.addEventListener("updatefound", () => watch(reg.installing));
          // A long session still hears about a new deploy.
          setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
        });
      }
    </script>
  </body>
</html>
