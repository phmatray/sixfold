# Writes dist/sw.js with the list of files to precache (see sw-manifest.sh).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "sh \"$TRUNK_SOURCE_DIR/sw-manifest.sh\""]

# Debug builds only (trunk serve): the Theatre Studio dev bundle (tools/theatre-dev.sh, git-ignored, AGPL) is
# served as theatre-dev.js so shot.js can load it at ?edit&studio. A release build never copies it.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "if [ \"$TRUNK_PROFILE\" = debug ] && [ -f \"$TRUNK_SOURCE_DIR/../tools/theatre/dev.js\" ]; then cp \"$TRUNK_SOURCE_DIR/../tools/theatre/dev.js\" \"$TRUNK_STAGING_DIR/theatre-dev.js\"; else rm -f \"$TRUNK_STAGING_DIR/theatre-dev.js\"; fi"]
