[package]
name = "sixfold-web"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["MediaQueryList", "Storage", "HtmlDialogElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "FocusOptions", "Navigator", "Location", "Clipboard", "DomRect"] }
sixfold-engine = { path = "../engine" }
