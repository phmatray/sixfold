[workspace]
resolver = "2"
members = ["engine", "web", "desktop"]
# A bare `cargo test`/`cargo build` skips the desktop shell (it needs web/dist, and WebKitGTK on Linux).
default-members = ["engine", "web"]

[workspace.package]
edition = "2021"
version = "1.11.0"
license = "MIT"

# WASM release builds: optimize for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# The wasm name section is most of the file; nothing reads it in production.
strip = true
