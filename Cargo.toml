[workspace]
resolver = "2"
members = ["engine", "web"]

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "MIT"

# WASM release builds: optimize for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# The wasm name section is most of the file; nothing reads it in production.
strip = true
