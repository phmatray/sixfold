name: Desktop

# Builds the desktop app (desktop/, Tauri v2): the Windows installer and the Linux AppImage.
# release-please.yml calls it with the new tag and the bundles go on that Release; on a pull
# request that touches the shell or its build, or run by hand (no tag), they stay a workflow artifact.
on:
  pull_request:
    paths: [desktop/**, Cargo.toml, Cargo.lock, web/Trunk.toml, web/sw-manifest.sh, .github/workflows/desktop.yml]
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:

# The build runs every dependency's build script, so it gets a read-only token; only `attach` writes.
permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk (Linux)
        if: runner.os == 'Linux'
        run: curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Install Trunk (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o trunk.zip https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-pc-windows-msvc.zip
          mkdir -p "$RUNNER_TEMP/trunk" && unzip -q trunk.zip -d "$RUNNER_TEMP/trunk" && rm trunk.zip
          echo "$RUNNER_TEMP/trunk" >> "$GITHUB_PATH"
      - name: WebKitGTK and friends (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version "^2" --locked
      # Runs trunk build --release first (beforeBuildCommand), which generate_context! needs.
      - run: cargo tauri build
      # Once is enough: the shell's code is the same on both systems.
      - if: runner.os == 'Linux'
        run: cargo clippy -p sixfold-desktop -- -D warnings
      - uses: actions/upload-artifact@v7
        with:
          name: sixfold-desktop-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach to the Release
    needs: bundle
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sixfold-desktop-*
          path: bundles
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" bundles/*/* --clobber --repo "$GITHUB_REPOSITORY"
