name: Desktop

# Builds the desktop app (desktop/, Tauri v2): the Windows installer and the Linux AppImage.
# release-please.yml calls it with the new tag and the bundles go on that Release; on a pull
# request that touches the shell, or run by hand (no tag), they are kept as a workflow artifact.
on:
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk (Linux)
        if: runner.os == 'Linux'
        run: curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Install Trunk (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o trunk.zip https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-pc-windows-msvc.zip
          mkdir -p "$RUNNER_TEMP/trunk" && unzip -q trunk.zip -d "$RUNNER_TEMP/trunk" && rm trunk.zip
          echo "$RUNNER_TEMP/trunk" >> "$GITHUB_PATH"
      - name: WebKitGTK and friends (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version "^2" --locked
      # Runs trunk build --release first (beforeBuildCommand), which generate_context! needs.
      - run: cargo tauri build
      - run: cargo clippy -p sixfold-desktop -- -D warnings
      - name: Attach to the GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then files=(target/release/bundle/nsis/*.exe); else files=(target/release/bundle/appimage/*.AppImage); fi
          gh release upload "$TAG" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v7
        if: env.TAG == ''
        with:
          name: sixfold-desktop-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
