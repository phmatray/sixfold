name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-please.yml runs the whole suite on a released commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-game-data.sh
      - run: node tools/check-maps.mjs web/world --strict && node tools/check-fence-table.mjs web/world/props.js

  rust:
    name: Engine tests, lint and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p sixfold-engine
      - name: Install Trunk
        run: curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Build web app
        working-directory: web
        run: trunk build --release
