name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-please.yml runs the whole suite on a released commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-no-game-data.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test web/gamepad.test.mjs web/world/camera.test.mjs web/world/tier.test.mjs tools/ld.test.mjs tools/check-maps.test.mjs tools/life.test.mjs tools/routine.test.mjs tools/transition.test.mjs tools/dressing.test.mjs
      - run: node tools/check-maps.mjs web/world --strict && node tools/check-fence-table.mjs web/world/props.js
      - run: node --test tools/check-tokens.test.mjs && node tools/check-tokens.mjs web/style.css

  rust:
    name: Engine tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop shell needs web/dist and WebKitGTK to compile; desktop.yml lints it.
      - run: cargo clippy --workspace --exclude sixfold-desktop --all-targets -- -D warnings
      - run: cargo test -p sixfold-engine -p sixfold-meta
      # The engine's test cards (feature `testkit`) are for sixfold-meta's tests only, never the shipped game.
      - run: "! cargo tree -p sixfold-web -e features --target wasm32-unknown-unknown | grep -q testkit"
      # The web crate's unit tests run on the host too (no browser, no wasm).
      - run: cargo test -p sixfold-web

  # Its own job, beside the lint and tests rather than after them: the browser tests wait only on this.
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Build web app
        working-directory: web
        run: trunk build --release
      - name: three.js ships with the game (no CDN) and is precached
        run: |
          if grep -q cdn.jsdelivr.net web/dist/index.html; then echo 'index.html still loads from a CDN'; exit 1; fi
          grep -q '"./vendor/three/build/three.module.min.js"' web/dist/sw.js
          grep -qx "$(sed -n 's/^THREE_VERSION=\${1:-\(.*\)}$/\1/p' tools/vendor-three.sh)" web/vendor/three/VERSION
          # The world's post-processing (#225), shipped and precached the same way.
          grep -q '"./vendor/postprocessing/index.js"' web/dist/sw.js
          grep -q '"./vendor/n8ao/N8AO.js"' web/dist/sw.js
          grep -qx "$(sed -n 's/^POSTPROCESSING_VERSION=\(.*\)$/\1/p' tools/vendor-three.sh)" web/vendor/postprocessing/VERSION
          grep -qx "$(sed -n 's/^N8AO_VERSION=\(.*\)$/\1/p' tools/vendor-three.sh)" web/vendor/n8ao/VERSION
      - name: The typefaces ship with the game (no CDN) and are precached
        run: |
          if grep -q fonts.googleapis.com web/dist/index.html; then echo 'index.html still loads fonts from a CDN'; exit 1; fi
          grep -q '"./fonts/' web/dist/sw.js
      # The e2e job tests this very build rather than building again.
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 3

  # Six machines, each a sixth of the journeys: on software GL they took ~38 min on one.
  e2e:
    name: Browser tests (Playwright ${{ matrix.shard }}/6)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a green shard takes ~10 min; a red one's retries need room to report
    strategy:
      fail-fast: false # one red shard still lets the others report theirs
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      # A spec taking `test` from @playwright/test would skip the error guard in helpers.ts.
      - name: Specs import from ./helpers only
        run: "! grep -n @playwright/test *.spec.ts"
      # The runner image already has the browser's system libraries (--with-deps spends minutes on apt).
      - run: npx playwright install --only-shell chromium
      # WebKit needs its own system libraries, which the runner image lacks.
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
