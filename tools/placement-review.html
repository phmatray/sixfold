<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement review</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel-2: #23272f; --line: #2f343e; --text: #e6e8ec; --dim: #9aa1ad; --faint: #6b7280;
    --error: #ef5b5b; --warn: #e8b33f; --info: #6aa4e8; --ok: #4fbf7f; --accent: #8fb3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .counts { display: flex; gap: 10px; color: var(--dim); }
  .counts b { color: var(--text); font-weight: 600; }
  .filters { display: flex; gap: 8px; margin-left: auto; }
  select, input[type=text] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .group { padding: 10px 14px 4px; color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; position: sticky; top: 0; background: var(--panel); }
  .item { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 14px; border: 0; background: none; border-left: 3px solid transparent; }
  .item:hover { background: var(--panel-2); }
  .item.on { background: var(--panel-2); border-left-color: var(--accent); }
  .item .what { display: block; }
  .item .rule { display: block; color: var(--faint); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
  .dot.error { background: var(--error); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); }
  main { overflow-y: auto; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .badge { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; }
  .badge.error { background: color-mix(in srgb, var(--error) 22%, transparent); color: var(--error); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .badge.info { background: color-mix(in srgb, var(--info) 22%, transparent); color: var(--info); }
  .why { font-size: 19px; font-weight: 600; margin: 2px 0 0; flex-basis: 100%; }
  .meta { color: var(--dim); }
  .needs { color: var(--dim); }
  .needs code { color: var(--text); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .pane h2 { margin: 0; padding: 8px 12px; font-size: 12.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .pane h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #0f1114; }
  .hover { padding: 6px 12px; color: var(--faint); font-size: 12px; min-height: 30px; border-top: 1px solid var(--line); }
  .fixes { display: flex; flex-direction: column; gap: 6px; }
  .fix { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .fix:hover { border-color: #3b4250; }
  .fix.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
  .fix kbd, .actions kbd { margin-left: auto; }
  kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  .none { color: var(--dim); padding: 8px 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
  .btn:hover:not(:disabled) { border-color: #4a5160; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.confirm { background: var(--ok); border-color: var(--ok); color: #08140d; }
  .btn.confirm kbd { color: #0d2a19; border-color: #2c7a4d; }
  .btn.reject { border-color: color-mix(in srgb, var(--error) 50%, var(--line)); }
  .note { flex: 1; min-width: 180px; }
  .status { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; }
  .status.ok { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .status.bad { border-color: color-mix(in srgb, var(--error) 60%, var(--line)); }
  .status .row { display: flex; gap: 12px; align-items: center; white-space: normal; }
  .status pre { margin: 8px 0 0; color: var(--dim); font-size: 12px; overflow-x: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--faint); font-size: 12px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .empty { margin: auto; text-align: center; color: var(--dim); }
  .empty h2 { color: var(--text); font-size: 18px; }
  @media (max-width: 1100px) { .panes { grid-template-columns: 1fr; } .app { grid-template-columns: 260px 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Placement review</h1>
    <div class="counts" id="counts"></div>
    <div class="filters">
      <select id="f-sev" aria-label="Severity"><option value="">All severities</option><option>error</option><option>warn</option><option>info</option></select>
      <select id="f-rule" aria-label="Rule"><option value="">All rules</option></select>
      <select id="f-map" aria-label="Map"><option value="">All maps</option></select>
    </div>
  </header>
  <aside id="list" aria-label="Findings"></aside>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const state = { all: [], shown: [], at: 0, maps: {}, fixes: [], pick: 0, undo: null, status: null };
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error ?? r.statusText);
  return j;
};

// ---------- The list ----------

async function refresh(keep) {
  const { findings, undo } = await api("/api/findings");
  state.all = findings;
  state.undo = undo;
  const opts = (sel, values) => { const cur = sel.value; sel.length = 1; for (const v of values) sel.add(new Option(v, v)); sel.value = values.includes(cur) ? cur : ""; };
  opts($("#f-rule"), [...new Set(findings.map((f) => f.rule))].sort());
  opts($("#f-map"), [...new Set(findings.map((f) => f.map))].sort());
  filter(keep);
}

function filter(keep) {
  const sev = $("#f-sev").value, rule = $("#f-rule").value, map = $("#f-map").value;
  state.shown = state.all.filter((f) => (!sev || f.severity === sev) && (!rule || f.rule === rule) && (!map || f.map === map));
  const c = (s) => state.all.filter((f) => f.severity === s).length;
  $("#counts").innerHTML = `<span><b>${state.all.length}</b> open</span><span><span class="dot error"></span> <b>${c("error")}</b></span><span><span class="dot warn"></span> <b>${c("warn")}</b></span><span><span class="dot info"></span> <b>${c("info")}</b></span>`;
  const list = $("#list");
  list.innerHTML = "";
  let last = "";
  state.shown.forEach((f, i) => {
    if (f.map !== last) list.insertAdjacentHTML("beforeend", `<div class="group">${(last = f.map)}</div>`);
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = `<span class="dot ${f.severity}"></span><span><span class="what">${f.asset} <span class="mono">${f.x},${f.z}</span></span><span class="rule">${f.rule}</span></span>`;
    b.onclick = () => select(i);
    list.append(b);
  });
  select(Math.min(keep ?? 0, Math.max(0, state.shown.length - 1)));
}

async function select(i) {
  state.at = i;
  document.querySelectorAll(".item").forEach((el, j) => el.classList.toggle("on", j === i));
  document.querySelectorAll(".item")[i]?.scrollIntoView({ block: "nearest" });
  const f = state.shown[i];
  if (!f) return renderEmpty();
  state.fixes = [];
  state.pick = 0;
  const map = await mapOf(f.map);
  if (state.shown[state.at] !== f) return; // moved on meanwhile
  render(f, map, null, { loading: true });
  const fx = await api(`/api/proposals?map=${f.map}&index=${f.index}&asset=${f.asset}&x=${f.x}&z=${f.z}`).catch((e) => ({ proposals: [], error: e.message }));
  if (state.shown[state.at] !== f) return;
  state.fixes = fx.proposals;
  render(f, map, fx.error, fx);
}

const mapOf = async (name) => (state.maps[name] ??= await api(`/api/map?name=${name}`));

// ---------- The card ----------

function renderEmpty() {
  $("#main").innerHTML = `<div class="empty"><h2>Nothing left to review</h2><p>${state.all.length ? "No finding matches these filters." : "Every finding is fixed or answered."}</p>${statusHtml()}</div>`;
  bindStatus();
}

function render(f, map, err, fx) {
  const fixes = state.fixes;
  $("#main").innerHTML = `
    <div class="card-head">
      <span class="badge ${f.severity}">${f.severity}</span>
      <span class="mono">${f.rule}</span>
      <span class="meta">${map.title} · ${map.kind}${map.region ? ` · ${map.region}` : ""} · <span class="mono">${f.asset}</span> at <span class="mono">${f.x},${f.z}</span>${f.rot ? `, rot ${f.rot}` : ""}${f.y ? `, y ${f.y}` : ""}</span>
      <p class="why">${f.why}</p>
      <span class="needs">It needs <code>${esc(f.need)}</code></span>
    </div>
    <div class="panes">
      <section class="pane"><h2>Before <span>as the map has it</span></h2><canvas id="before"></canvas><div class="hover" id="hover-before"></div></section>
      <section class="pane"><h2>After <span id="after-label"></span></h2><canvas id="after"></canvas><div class="hover" id="hover-after"></div></section>
    </div>
    <div class="fixes" id="fixes">
      ${fx?.loading ? `<p class="none">Looking for a better place, and running check-maps on each one…</p>` : fixes.length ? fixes.map((p, i) => `<button class="fix${i === state.pick ? " on" : ""}" data-i="${i}">${icon(p.kind)} ${p.label}<kbd>${i + 1}</kbd></button>`).join("")
        : `<p class="none">${err ? `Could not propose a fix: ${esc(err)}` : `No placement within 10 tiles keeps every rule and check-maps passing${fx?.blocked ? ` (the nearest one fails: ${esc(fx.blocked)})` : ""}. Move it by hand in the map, or answer it below.`}</p>`}
    </div>
    <div class="actions">
      <button class="btn confirm" id="confirm" ${fixes.length ? "" : "disabled"}>Confirm fix <kbd>Enter</kbd></button>
      <button class="btn reject" id="reject">It's fine, keep it <kbd>R</kbd></button>
      <input type="text" class="note" id="note" placeholder="Why it's fine (optional, saved with the answer)">
      <button class="btn" id="prev">Previous <kbd>←</kbd></button>
      <button class="btn" id="next">Skip <kbd>→</kbd></button>
    </div>
    ${statusHtml()}
    <div class="legend">${LEGEND.map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}<span>Red outline: the finding · green: where the fix puts it · dashed: where it stood</span></div>`;
  document.querySelectorAll(".fix").forEach((b) => (b.onclick = () => pick(+b.dataset.i)));
  $("#confirm").onclick = confirmFix;
  $("#reject").onclick = rejectIt;
  $("#prev").onclick = () => select(Math.max(0, state.at - 1));
  $("#next").onclick = () => select(Math.min(state.shown.length - 1, state.at + 1));
  bindStatus();
  draw(f, map);
}

function pick(i) {
  state.pick = i;
  document.querySelectorAll(".fix").forEach((b, j) => b.classList.toggle("on", j === i));
  draw(state.shown[state.at], state.maps[state.shown[state.at].map]);
}

const icon = (k) => ({ lift: "⤒", turn: "↻", move: "➜" })[k] ?? "•";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function statusHtml() {
  const s = state.status;
  if (!s && !state.undo) return "";
  const lines = s?.check?.lines?.length ? `<pre>${esc(s.check.lines.join("\n"))}</pre>` : "";
  const cls = !s?.check ? "" : s.check.ok ? "ok" : "bad";
  const msg = s ? `${esc(s.text)}${s.check ? (s.check.ok ? " · check-maps --strict passes" : " · check-maps --strict FAILS: undo, or fix the map by hand") : ""}` : "";
  return `<div class="status ${cls}"><div class="row"><span>${msg}</span>${state.undo ? `<button class="btn" id="undo" style="margin-left:auto">Undo ${esc(state.undo)} <kbd>U</kbd></button>` : ""}</div>${s?.check && !s.check.ok ? lines : ""}</div>`;
}
function bindStatus() { const u = $("#undo"); if (u) u.onclick = undoLast; }

// ---------- Actions ----------

async function confirmFix() {
  const f = state.shown[state.at], p = state.fixes[state.pick];
  if (!f || !p) return;
  try {
    const r = await api("/api/apply", { map: f.map, index: f.index, asset: f.asset, x: f.x, z: f.z, patch: p.patch });
    delete state.maps[f.map];
    state.status = { text: `Applied: ${p.label.toLowerCase()} (${f.asset} on ${f.map})`, check: r.check };
  } catch (e) { state.status = { text: `Not applied: ${e.message}` }; delete state.maps[f.map]; }
  await refresh(state.at);
}

async function rejectIt() {
  const f = state.shown[state.at];
  if (!f) return;
  const note = $("#note")?.value.trim();
  await api("/api/reject", { map: f.map, rule: f.rule, asset: f.asset, x: f.x, z: f.z, note });
  state.status = { text: `Kept as it is: ${f.asset} ${f.x},${f.z} on ${f.map} (${f.rule})` };
  await refresh(state.at);
}

async function undoLast() {
  try {
    const r = await api("/api/undo", {});
    state.maps = {};
    state.status = { text: `Undone: ${r.undone}`, check: r.check };
  } catch (e) { state.status = { text: e.message }; }
  await refresh(state.at);
}

for (const id of ["#f-sev", "#f-rule", "#f-map"]) $(id).onchange = () => filter(0);
addEventListener("keydown", (e) => {
  if (e.target.matches("input, select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "ArrowRight" || e.key === "j") select(Math.min(state.shown.length - 1, state.at + 1));
  else if (e.key === "ArrowLeft" || e.key === "k") select(Math.max(0, state.at - 1));
  else if (e.key === "Enter") confirmFix();
  else if (e.key === "r") rejectIt();
  else if (e.key === "u" && state.undo) undoLast();
  else if (/^[1-9]$/.test(e.key) && +e.key <= state.fixes.length) pick(+e.key - 1);
  else return;
  e.preventDefault();
});

// ---------- Drawing the map from above ----------

const TILE = { ".": "#4f7d39", p: "#c7a26b", r: "#9b9a93", "~": "#2f6fae", s: "#d8c58f", "=": "#8a5f37", H: "#74502f", f: "#6e4b2a", W: "#3a3c46", V: "#4a5770", "#": "#2d2f36", w: "#7d5f40" };
const LEGEND = [["#4f7d39", "grass"], ["#c7a26b", "path"], ["#9b9a93", "plaza"], ["#2f6fae", "water"], ["#d8c58f", "sand"], ["#8a5f37", "boardwalk / pier"], ["#7a8a63", "raised ground (digit = metres)"], ["#3a3c46", "wall / fence"], ["#ffd25e", "light"], ["#2e5b2a", "tree"]];
const tileColour = (c) => (c >= "1" && c <= "9" ? shade("#7a8a63", (+c - 1) * 0.07) : TILE[c] ?? "#555");
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = (v) => Math.round(Math.min(255, v + (255 - v) * k)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function propColour(p) {
  const a = p.asset;
  if (/lantern|lamp/.test(a)) return "#ffd25e";
  if (/(^|_)(tree|pine|birch|willow)$|standing_tree|blossom/.test(a)) return "#2e5b2a";
  if (/bush|heather|flowers|reeds|moonflower|mushroom|plant|planter|lilies/.test(a)) return "#7fbf5a";
  if (/rock|rubble|cairn|menhir|stone/.test(a)) return "#a7a59c";
  if (/sign|waymark/.test(a)) return "#ff9f43";
  if (/boat|buoy|ferry|bollard|net|crab/.test(a)) return "#7fc8f0";
  if (/crate|cart|barrel|cullet/.test(a)) return "#c98b4a";
  if (p.w * p.d >= 6) return "#8c6a55";
  return "#b7a3d6";
}
const FACE = { 0: [0, 1], 90: [1, 0], 180: [0, -1], 270: [-1, 0] };

function draw(f, map) {
  const fix = state.fixes[state.pick];
  const subject = map.props.find((p, i) => i === f.index);
  const moved = fix ? { ...subject, ...Object.fromEntries(Object.entries(fix.patch).filter(([k]) => ["x", "z", "rot", "y"].includes(k))) } : null;
  if (moved) { if (moved.rot % 180 !== subject.rot % 180) [moved.w, moved.d] = [subject.d, subject.w]; moved.y = fix.patch.y ?? 0; }
  // One window for both panes: the subject (both places) with 6 tiles round it, kept on the map.
  const boxes = [subject, moved].filter(Boolean);
  let x0 = Math.min(...boxes.map((b) => b.x)) - 6, x1 = Math.max(...boxes.map((b) => b.x + b.w)) + 6;
  let z0 = Math.min(...boxes.map((b) => b.z)) - 5, z1 = Math.max(...boxes.map((b) => b.z + b.d)) + 5;
  // Keep a 4:3 window.
  const want = Math.max(x1 - x0, (z1 - z0) * 4 / 3);
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  x0 = Math.floor(cx - want / 2); x1 = Math.ceil(cx + want / 2); z0 = Math.floor(cz - want * 3 / 8); z1 = Math.ceil(cz + want * 3 / 8);
  // Slide it back onto the map where the map is big enough.
  const slide = (a, b, size) => (a < 0 && b - a <= size ? [0, b - a] : b > size && b - a <= size ? [a - (b - size), size] : [a, b]);
  [x0, x1] = slide(x0, x1, map.width); [z0, z1] = slide(z0, z1, map.height);
  const view = { x0, z0, x1, z1 };
  paint($("#before"), map, view, { subject, mark: "#ff5c5c" }, $("#hover-before"));
  const afterProps = map.props.map((p, i) => (i === f.index ? moved : p)).filter(Boolean);
  const spotsAfter = map.spots.map((s, i) => (fix?.patch.spots?.includes(i) ? { ...s, x: s.x + (fix.patch.x - f.x), z: s.z + (fix.patch.z - f.z) } : s));
  paint($("#after"), { ...map, props: afterProps, spots: spotsAfter }, view, { subject: moved ?? subject, ghost: moved && subject, mark: moved ? "#4fdf8f" : "#ff5c5c" }, $("#hover-after"));
  $("#after-label").textContent = fix ? fix.label.toLowerCase() : "no fix proposed";
}

function paint(canvas, map, v, o, hover) {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  const g = canvas.getContext("2d"), cols = v.x1 - v.x0, rows = v.z1 - v.z0, s = Math.min(canvas.width / cols, canvas.height / rows);
  const ox = (canvas.width - cols * s) / 2, oz = (canvas.height - rows * s) / 2;
  const X = (x) => ox + (x - v.x0) * s, Z = (z) => oz + (z - v.z0) * s;
  g.fillStyle = "#0f1114"; g.fillRect(0, 0, canvas.width, canvas.height);
  for (let z = v.z0; z < v.z1; z++) for (let x = v.x0; x < v.x1; x++) {
    const c = map.tiles[z]?.[x];
    if (c === undefined) continue;
    g.fillStyle = tileColour(c); g.fillRect(X(x), Z(z), s + 0.5, s + 0.5);
    const pc = map.paint?.[z]?.[x];
    if (pc && pc !== ".") { g.globalAlpha = 0.85; g.fillStyle = TILE[pc] ?? "#999"; g.fillRect(X(x) + s * 0.08, Z(z) + s * 0.08, s * 0.84, s * 0.84); g.globalAlpha = 1; }
    if (c >= "1" && c <= "9" && s > 18) { g.fillStyle = "rgba(255,255,255,.35)"; g.font = `${Math.round(s * 0.32)}px ui-monospace, Menlo, monospace`; g.fillText(c, X(x) + s * 0.08, Z(z) + s * 0.34); }
    if (c === "f") { g.strokeStyle = "#d9b98a"; g.lineWidth = Math.max(1, s * 0.08); g.strokeRect(X(x) + s * 0.3, Z(z) + s * 0.3, s * 0.4, s * 0.4); }
  }
  // Grid and ruler.
  g.strokeStyle = "rgba(0,0,0,.18)"; g.lineWidth = 1;
  for (let x = v.x0; x <= v.x1; x++) { g.beginPath(); g.moveTo(X(x), Z(v.z0)); g.lineTo(X(x), Z(v.z1)); g.stroke(); }
  for (let z = v.z0; z <= v.z1; z++) { g.beginPath(); g.moveTo(X(v.x0), Z(z)); g.lineTo(X(v.x1), Z(z)); g.stroke(); }
  g.fillStyle = "rgba(255,255,255,.55)"; g.font = `${Math.round(Math.max(10, s * 0.3))}px ui-monospace, Menlo, monospace`;
  for (let x = v.x0; x < v.x1; x++) if (x >= 0 && x % 5 === 0) g.fillText(x, X(x) + 2, Z(v.z0) + s * 0.3);
  for (let z = v.z0; z < v.z1; z++) if (z >= 0 && z % 5 === 0) g.fillText(z, X(v.x0) + 2, Z(z) + s * 0.62);
  // Props: walked-on ones first, then by height.
  const props = [...map.props].sort((a, b) => (b.ground - a.ground) || a.tall - b.tall);
  for (const p of props) {
    const x = X(p.x), z = Z(p.z), w = p.w * s, d = p.d * s, col = propColour(p);
    if (p.ground) { g.fillStyle = "rgba(140,98,57,.55)"; g.fillRect(x, z, w, d); continue; }
    const inset = p.w * p.d === 1 ? s * 0.16 : s * 0.06;
    g.fillStyle = col;
    if (col === "#2e5b2a" || col === "#ffd25e" || col === "#7fbf5a") { g.beginPath(); g.arc(x + w / 2, z + d / 2, Math.min(w, d) / 2 - inset * (col === "#7fbf5a" ? 1.6 : 0.5), 0, 7); g.fill(); if (col === "#ffd25e") { g.strokeStyle = "rgba(255,210,94,.35)"; g.lineWidth = s * 0.12; g.beginPath(); g.arc(x + w / 2, z + d / 2, s * 0.6, 0, 7); g.stroke(); } }
    else { g.fillRect(x + inset, z + inset, w - 2 * inset, d - 2 * inset); g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 1; g.strokeRect(x + inset, z + inset, w - 2 * inset, d - 2 * inset); }
    // Its face.
    const [fx, fz] = FACE[p.rot % 360] ?? [0, 1];
    g.strokeStyle = "rgba(0,0,0,.6)"; g.lineWidth = Math.max(1.5, s * 0.07);
    g.beginPath(); g.moveTo(x + w / 2, z + d / 2); g.lineTo(x + w / 2 + fx * (w / 2 - inset), z + d / 2 + fz * (d / 2 - inset)); g.stroke();
    if (s >= 26 && (p.w * p.d > 1 || /sign|lantern|bench|crate|boat|cart|planter|table|chair/.test(p.asset))) label(g, p.asset.replace(/_/g, " "), x + w / 2, z + d + s * 0.02, s);
  }
  for (const dr of map.doors) { g.fillStyle = "#1b1b1f"; g.fillRect(X(dr.x) + s * 0.3, Z(dr.z) + s * 0.55, s * 0.4, s * 0.45); g.strokeStyle = "#f1e3c2"; g.lineWidth = 1.5; g.strokeRect(X(dr.x) + s * 0.3, Z(dr.z) + s * 0.55, s * 0.4, s * 0.45); }
  for (const sp of map.spots) { g.fillStyle = "#fff"; g.beginPath(); g.arc(X(sp.x) + s * 0.82, Z(sp.z) + s * 0.18, s * 0.09, 0, 7); g.fill(); }
  for (const n of map.npcs) { g.fillStyle = "#c06cf0"; g.beginPath(); g.arc(X(n.x) + s / 2, Z(n.z) + s / 2, s * 0.28, 0, 7); g.fill(); g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke(); }
  // Where it stood (dashed), and the subject.
  const outline = (p, colour, dash) => { g.save(); g.setLineDash(dash ? [s * 0.18, s * 0.12] : []); g.strokeStyle = colour; g.lineWidth = Math.max(2.5, s * 0.1); g.strokeRect(X(p.x) + 1, Z(p.z) + 1, p.w * s - 2, p.d * s - 2); g.restore(); };
  if (o.ghost) outline(o.ghost, "rgba(255,255,255,.8)", true);
  if (o.subject) {
    outline(o.subject, o.mark, false);
    const floor = Math.max(...Array.from({ length: o.subject.w * o.subject.d }, (_, i) => { const c = map.tiles[o.subject.z + Math.floor(i / o.subject.w)]?.[o.subject.x + (i % o.subject.w)]; return c >= "1" && c <= "9" ? +c : c === "=" ? 0.1 : c === "H" ? 0.3 : 0; }));
    label(g, `${o.subject.asset}  y ${+(o.subject.y ?? 0).toFixed(2)} · floor ${floor}`, X(o.subject.x) + o.subject.w * s / 2, Z(o.subject.z) - s * 0.5, s, o.mark);
  }
  canvas.onmousemove = (e) => {
    const b = canvas.getBoundingClientRect(), x = Math.floor(((e.clientX - b.left) * dpr - ox) / s) + v.x0, z = Math.floor(((e.clientY - b.top) * dpr - oz) / s) + v.z0;
    const c = map.tiles[z]?.[x];
    if (c === undefined) return (hover.textContent = "");
    const here = map.props.filter((p) => x >= p.x && x < p.x + p.w && z >= p.z && z < p.z + p.d).map((p) => `${p.asset}${p.y ? ` (y ${p.y})` : ""}${p.rot ? ` rot ${p.rot}` : ""}`);
    const extra = [...map.doors.filter((d) => d.x === x && d.z === z).map((d) => `door to ${d.to}`), ...map.spots.filter((d) => d.x === x && d.z === z).map((d) => `spot (${d.kind})`), ...map.npcs.filter((n) => n.x === x && n.z === z).map((n) => `npc ${n.id}`)];
    hover.innerHTML = `<span class="mono">${x},${z}</span> · tile <span class="mono">${esc(c)}</span>${map.paint?.[z]?.[x] && map.paint[z][x] !== "." ? ` · paint ${map.paint[z][x]}` : ""}${[...here, ...extra].length ? ` · ${esc([...here, ...extra].join(", "))}` : ""}`;
  };
  canvas.onmouseleave = () => (hover.textContent = "");
}

function label(g, text, x, y, s, colour) {
  g.font = `600 ${Math.round(Math.max(10, Math.min(15, s * 0.36)))}px ui-sans-serif, system-ui, sans-serif`;
  const w = g.measureText(text).width + 8, h = Math.max(14, Math.min(20, s * 0.5));
  g.fillStyle = colour ? "rgba(10,12,15,.88)" : "rgba(10,12,15,.6)";
  g.fillRect(x - w / 2, y, w, h);
  g.fillStyle = colour ?? "#e6e8ec"; g.textBaseline = "top"; g.fillText(text, x - w / 2 + 4, y + (h - Math.max(10, Math.min(15, s * 0.36))) / 2 - 1); g.textBaseline = "alphabetic";
}

addEventListener("resize", () => { const f = state.shown[state.at]; if (f && state.maps[f.map]) draw(f, state.maps[f.map]); });
refresh(0).catch((e) => ($("#main").innerHTML = `<p class="empty">Could not load: ${esc(e.message)}</p>`));
</script>
</body>
</html>
