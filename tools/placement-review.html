<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement review</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel-2: #23272f; --line: #2f343e; --text: #e6e8ec; --dim: #9aa1ad; --faint: #6b7280;
    --error: #ef5b5b; --warn: #e8b33f; --info: #6aa4e8; --ok: #4fbf7f; --accent: #8fb3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .counts { display: flex; gap: 10px; color: var(--dim); }
  .counts b { color: var(--text); font-weight: 600; }
  .filters { display: flex; gap: 8px; margin-left: auto; }
  select, input[type=text] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  #goto { width: 120px; font-family: ui-monospace, Menlo, monospace; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .group { padding: 10px 14px 4px; color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 14px; border: 0; background: none; border-left: 3px solid transparent; }
  .item:hover { background: var(--panel-2); }
  .item.on { background: var(--panel-2); border-left-color: var(--accent); }
  .item .what { display: block; }
  .item .rule { display: block; color: var(--faint); font-size: 12px; }
  .item .id { color: var(--faint); font-size: 11.5px; }
  .count { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 4px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim); font-size: 11.5px; text-align: center; }
  .item.on .count { background: var(--bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
  .dot.error { background: var(--error); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); }
  main { overflow-y: auto; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .badge { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; }
  .badge.error { background: color-mix(in srgb, var(--error) 22%, transparent); color: var(--error); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .badge.info { background: color-mix(in srgb, var(--info) 22%, transparent); color: var(--info); }
  .idtag { font: 600 13px ui-monospace, Menlo, monospace; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 5px; padding: 1px 7px; }
  .idtag:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .why { font-size: 19px; font-weight: 600; margin: 2px 0 0; flex-basis: 100%; }
  .meta { color: var(--dim); }
  .needs { color: var(--dim); }
  .needs code { color: var(--text); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
  .viewbar { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12.5px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); padding: 4px 12px; font-weight: 600; color: var(--dim); }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .pane h2 { margin: 0; padding: 8px 12px; font-size: 12.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  .pane h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #0f1114; }
  canvas.gl { cursor: grab; touch-action: none; }
  canvas.gl:active { cursor: grabbing; }
  .hover { padding: 6px 12px; color: var(--faint); font-size: 12px; min-height: 30px; border-top: 1px solid var(--line); }
  .fixes { display: flex; flex-direction: column; gap: 6px; }
  .fix { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: left; }
  .fix:hover { border-color: #3b4250; }
  .fix.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
  .fix kbd, .actions kbd { margin-left: auto; }
  .plan { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .plan-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--dim); }
  .plan-head b { color: var(--text); }
  .plan-head button { margin-left: auto; background: none; border: 0; color: var(--accent); padding: 0; }
  .plan ul { list-style: none; margin: 0; padding: 4px 0; max-height: 240px; overflow-y: auto; }
  .plan li label { display: grid; grid-template-columns: 18px 64px 150px 1fr; gap: 10px; align-items: baseline; padding: 4px 12px; cursor: pointer; }
  .plan li label:hover { background: var(--panel-2); }
  .plan li .none { color: var(--faint); padding: 0; }
  .plan li .mid { color: var(--accent); }
  .plan input { accent-color: var(--ok); }
  kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  .none { color: var(--dim); padding: 8px 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
  .btn:hover:not(:disabled) { border-color: #4a5160; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.confirm { background: var(--ok); border-color: var(--ok); color: #08140d; }
  .btn.confirm kbd { color: #0d2a19; border-color: #2c7a4d; }
  .btn.reject { border-color: color-mix(in srgb, var(--error) 50%, var(--line)); }
  .note { flex: 1; min-width: 180px; }
  .status { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; }
  .status.ok { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .status.bad { border-color: color-mix(in srgb, var(--error) 60%, var(--line)); }
  .status .row { display: flex; gap: 12px; align-items: center; white-space: normal; }
  .status pre { margin: 8px 0 0; color: var(--dim); font-size: 12px; overflow-x: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--faint); font-size: 12px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .empty { margin: auto; text-align: center; color: var(--dim); }
  .empty h2 { color: var(--text); font-size: 18px; }
  @media (max-width: 1100px) { .panes { grid-template-columns: 1fr; } .app { grid-template-columns: 260px 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Placement review</h1>
    <div class="counts" id="counts"></div>
    <div class="filters">
      <input type="text" id="goto" placeholder="Go to #id" aria-label="Go to a finding by its id">
      <select id="f-sev" aria-label="Severity"><option value="">All severities</option><option>error</option><option>warn</option><option>info</option></select>
      <select id="f-rule" aria-label="Rule"><option value="">All rules</option></select>
      <select id="f-map" aria-label="Map"><option value="">All maps</option></select>
    </div>
  </header>
  <aside id="list" aria-label="Findings"></aside>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<script type="module">
import * as THREE from "three";

const $ = (s) => document.querySelector(s);
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
// fixes: one prop's alternatives; plan: a block's items; checked: the block's items ticked.
const state = { all: [], shown: [], at: 0, maps: {}, fixes: [], pick: 0, plan: null, checked: new Set(), loading: false, undo: null, status: null, mode: store.get("placement.view", "2d") };
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error ?? r.statusText);
  return j;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const icon = (k) => ({ lift: "⤒", turn: "↻", move: "➜" })[k] ?? "•";
const span = (m) => { const xs = m.map((p) => p.x), zs = m.map((p) => p.z); return `${Math.min(...xs)},${Math.min(...zs)} – ${Math.max(...xs)},${Math.max(...zs)}`; };

// ---------- The list ----------

async function refresh(keep) {
  const { blocks, undo } = await api("/api/blocks");
  state.all = blocks;
  state.undo = undo;
  const opts = (sel, values) => { const cur = sel.value; sel.length = 1; for (const v of values) sel.add(new Option(v, v)); sel.value = values.includes(cur) ? cur : ""; };
  opts($("#f-rule"), [...new Set(blocks.map((b) => b.rule))].sort());
  opts($("#f-map"), [...new Set(blocks.map((b) => b.map))].sort());
  filter(keep);
}

function filter(keep) {
  const sev = $("#f-sev").value, rule = $("#f-rule").value, map = $("#f-map").value;
  state.shown = state.all.filter((b) => (!sev || b.severity === sev) && (!rule || b.rule === rule) && (!map || b.map === map));
  const n = (s) => state.all.filter((b) => !s || b.severity === s).reduce((k, b) => k + b.members.length, 0);
  $("#counts").innerHTML = `<span><b>${n()}</b> findings in <b>${state.all.length}</b> blocks</span><span><span class="dot error"></span> <b>${n("error")}</b></span><span><span class="dot warn"></span> <b>${n("warn")}</b></span><span><span class="dot info"></span> <b>${n("info")}</b></span>`;
  const list = $("#list");
  list.innerHTML = "";
  let last = "";
  state.shown.forEach((b, i) => {
    if (b.map !== last) list.insertAdjacentHTML("beforeend", `<div class="group">${(last = b.map)}</div>`);
    const el = document.createElement("button"), m = b.members, one = m.length === 1;
    const assets = [...new Set(m.map((x) => x.asset))].join(", ");
    el.className = "item";
    el.innerHTML = `<span class="dot ${b.severity}"></span><span><span class="what">${assets}${one ? ` <span class="mono">${m[0].x},${m[0].z}</span>` : `<span class="count">${m.length}</span>`}</span><span class="rule">${b.rule}${one ? "" : ` · ${span(m)}`}</span></span><span class="id mono">#${b.id}</span>`;
    el.onclick = () => select(i);
    list.append(el);
  });
  select(Math.min(keep ?? 0, Math.max(0, state.shown.length - 1)));
}

// Go to the block holding a finding's id (filters cleared when they hide it).
function goTo(raw) {
  const id = raw.trim().replace(/^#/, "").toLowerCase();
  if (!id) return;
  const has = (b) => b.id === id || b.members.some((m) => m.id === id);
  if (!state.shown.some(has) && state.all.some(has)) { $("#f-sev").value = $("#f-rule").value = $("#f-map").value = ""; filter(0); }
  const i = state.shown.findIndex(has);
  if (i < 0) { state.status = { text: `No open finding #${id} (fixed, answered, or its prop moved).` }; const b = state.shown[state.at]; return b ? render(b, state.maps[b.map]) : renderEmpty(); }
  select(i);
}

async function select(i) {
  state.at = i;
  document.querySelectorAll(".item").forEach((el, j) => el.classList.toggle("on", j === i));
  document.querySelectorAll(".item")[i]?.scrollIntoView({ block: "nearest" });
  const b = state.shown[i];
  if (!b) return renderEmpty();
  Object.assign(state, { fixes: [], pick: 0, plan: null, checked: new Set(), loading: true, blocked: null, error: null });
  const map = await mapOf(b.map);
  if (state.shown[state.at] !== b) return; // moved on meanwhile
  render(b, map);
  try {
    if (b.members.length === 1) {
      const f = b.members[0], r = await api(`/api/proposals?map=${b.map}&index=${f.index}&asset=${f.asset}&x=${f.x}&z=${f.z}`);
      state.fixes = r.proposals, state.blocked = r.blocked;
    } else {
      state.plan = (await api(`/api/plan?map=${b.map}&indices=${b.members.map((m) => m.index).join(",")}`)).items;
      state.checked = new Set(state.plan.map((_, k) => k));
    }
  } catch (e) { state.error = e.message; }
  if (state.shown[state.at] !== b) return;
  state.loading = false;
  render(b, map);
}

const mapOf = async (name) => (state.maps[name] ??= await api(`/api/map?name=${name}`));

// ---------- The card ----------

function renderEmpty() {
  $("#main").innerHTML = `<div class="empty"><h2>Nothing left to review</h2><p>${state.all.length ? "No finding matches these filters." : "Every finding is fixed or answered."}</p>${statusHtml()}</div>`;
  bindStatus();
}

// What a fix does to each member: [{ index, patch }], from the alternative picked or the plan's ticked items.
function chosen() {
  if (state.plan) return state.plan.filter((it, k) => it.fix && state.checked.has(k)).map((it) => ({ index: it.index, patch: it.fix.patch }));
  const f = state.shown[state.at]?.members[0], p = state.fixes[state.pick];
  return f && p ? [{ index: f.index, patch: p.patch }] : [];
}

function render(b, map) {
  const one = b.members.length === 1, f = b.members[0];
  const moves = chosen().length;
  $("#main").innerHTML = `
    <div class="card-head">
      <button class="idtag" id="copy-id" title="Copy the id, to quote it">#${b.id}</button>
      <span class="badge ${b.severity}">${b.severity}</span>
      <span class="mono">${b.rule}</span>
      <span class="meta">${map.title} · ${map.kind}${map.region ? ` · ${map.region}` : ""} · ${one ? `<span class="mono">${f.asset}</span> at <span class="mono">${f.x},${f.z}</span>${f.rot ? `, rot ${f.rot}` : ""}${f.y ? `, y ${f.y}` : ""}` : `a block of <b>${b.members.length}</b> props, ${span(b.members)}`}</span>
      <p class="why">${b.why}</p>
      <span class="needs">It needs <code>${esc(b.need)}</code></span>
    </div>
    <div class="viewbar"><span class="seg"><button data-mode="2d" class="${state.mode === "2d" ? "on" : ""}">2D</button><button data-mode="3d" class="${state.mode === "3d" ? "on" : ""}">3D</button></span><kbd>V</kbd>${state.mode === "3d" ? "<span>Drag to turn, scroll to zoom, double-click to reset; both views move together.</span>" : ""}</div>
    <div class="panes">
      <section class="pane"><h2>Before <span>as the map has it</span></h2><canvas id="before" class="${state.mode === "3d" ? "gl" : ""}"></canvas><div class="hover" id="hover-before"></div></section>
      <section class="pane"><h2>After <span id="after-label"></span></h2><canvas id="after" class="${state.mode === "3d" ? "gl" : ""}"></canvas><div class="hover" id="hover-after"></div></section>
    </div>
    ${one ? fixesHtml() : planHtml()}
    <div class="actions">
      <button class="btn confirm" id="confirm" ${moves ? "" : "disabled"}>${one ? "Confirm fix" : `Confirm ${moves} fix${moves === 1 ? "" : "es"}`} <kbd>Enter</kbd></button>
      <button class="btn reject" id="reject">${one ? "It's fine, keep it" : `They're fine (${state.plan ? state.checked.size : b.members.length})`} <kbd>R</kbd></button>
      <input type="text" class="note" id="note" placeholder="Why it's fine (optional, saved with the answer)">
      <button class="btn" id="prev">Previous <kbd>←</kbd></button>
      <button class="btn" id="next">Skip <kbd>→</kbd></button>
    </div>
    ${statusHtml()}
    <div class="legend">${LEGEND.map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}<span>Red: the finding · green: where the fix puts it · dashed: where it stood</span></div>`;
  document.querySelectorAll(".fix").forEach((el) => (el.onclick = () => pick(+el.dataset.i)));
  document.querySelectorAll(".plan input").forEach((el) => (el.onchange = () => { el.checked ? state.checked.add(+el.dataset.k) : state.checked.delete(+el.dataset.k); render(b, map); }));
  $("#all")?.addEventListener("click", () => { state.checked = state.checked.size === state.plan.length ? new Set() : new Set(state.plan.map((_, k) => k)); render(b, map); });
  document.querySelectorAll(".seg button").forEach((el) => (el.onclick = () => setMode(el.dataset.mode)));
  $("#copy-id").onclick = () => { navigator.clipboard?.writeText(`#${b.id}`).catch(() => {}); $("#copy-id").textContent = "copied"; setTimeout(() => $("#copy-id") && ($("#copy-id").textContent = `#${b.id}`), 900); };
  $("#confirm").onclick = confirmFix;
  $("#reject").onclick = rejectIt;
  $("#prev").onclick = () => select(Math.max(0, state.at - 1));
  $("#next").onclick = () => select(Math.min(state.shown.length - 1, state.at + 1));
  bindStatus();
  draw(b, map);
}

function fixesHtml() {
  if (state.loading) return `<p class="none">Looking for a better place, and running check-maps on each one…</p>`;
  if (state.error) return `<p class="none">Could not propose a fix: ${esc(state.error)}</p>`;
  if (!state.fixes.length) return `<p class="none">No placement within 10 tiles keeps every rule and check-maps passing${state.blocked ? ` (the nearest one fails: ${esc(state.blocked)})` : ""}. Move it by hand in the map, or answer it below.</p>`;
  return `<div class="fixes">${state.fixes.map((p, i) => `<button class="fix${i === state.pick ? " on" : ""}" data-i="${i}">${icon(p.kind)} ${p.label}<kbd>${i + 1}</kbd></button>`).join("")}</div>`;
}

function planHtml() {
  if (state.loading) return `<p class="none">Planning a fix for each prop, each built on the ones before, then running check-maps on the whole block…</p>`;
  if (state.error) return `<p class="none">Could not plan the block: ${esc(state.error)}</p>`;
  const fixed = state.plan.filter((it) => it.fix).length, members = state.shown[state.at].members;
  return `<div class="plan"><div class="plan-head"><span><b>${fixed}</b> of ${state.plan.length} get a fix that keeps check-maps passing; untick any to leave it for now.</span><button id="all">${state.checked.size === state.plan.length ? "Untick all" : "Tick all"}</button></div><ul>${state.plan.map((it, k) =>
    `<li><label><input type="checkbox" data-k="${k}" ${state.checked.has(k) ? "checked" : ""}><span class="mono mid">#${members.find((m) => m.index === it.index)?.id ?? ""}</span><span class="mono">${it.asset} ${it.x},${it.z}</span>${it.fix ? `<span>${icon(it.fix.kind)} ${esc(it.fix.label)}</span>` : `<span class="none">no fix: ${esc(it.why ?? "")}</span>`}</label></li>`).join("")}</ul></div>`;
}

function pick(i) {
  state.pick = i;
  const b = state.shown[state.at];
  render(b, state.maps[b.map]);
}

function setMode(mode) {
  state.mode = mode;
  store.set("placement.view", mode);
  const b = state.shown[state.at];
  if (b) render(b, state.maps[b.map]);
}

function statusHtml() {
  const s = state.status;
  if (!s && !state.undo) return "";
  const lines = s?.check?.lines?.length ? `<pre>${esc(s.check.lines.join("\n"))}</pre>` : "";
  const cls = !s?.check ? "" : s.check.ok ? "ok" : "bad";
  const msg = s ? `${esc(s.text)}${s.check ? (s.check.ok ? " · check-maps --strict passes" : " · check-maps --strict FAILS: undo, or fix the map by hand") : ""}` : "";
  return `<div class="status ${cls}"><div class="row"><span>${msg}</span>${state.undo ? `<button class="btn" id="undo" style="margin-left:auto">Undo ${esc(state.undo)} <kbd>U</kbd></button>` : ""}</div>${s?.check && !s.check.ok ? lines : ""}</div>`;
}
function bindStatus() { const u = $("#undo"); if (u) u.onclick = undoLast; }

// ---------- Actions ----------

async function confirmFix() {
  const b = state.shown[state.at], fixes = chosen();
  if (!b || !fixes.length || state.loading) return;
  const items = fixes.map(({ index, patch }) => { const m = b.members.find((x) => x.index === index); return { index, asset: m.asset, x: m.x, z: m.z, patch }; });
  try {
    const r = await api("/api/apply", { map: b.map, items });
    state.status = { text: `Applied ${items.length > 1 ? `${items.length} fixes` : (state.fixes[state.pick]?.label ?? "the fix").toLowerCase()} on ${b.map} (#${b.id})`, check: r.check };
  } catch (e) { state.status = { text: `Not applied: ${e.message}` }; }
  delete state.maps[b.map];
  await refresh(state.at);
}

async function rejectIt() {
  const b = state.shown[state.at];
  if (!b || state.loading) return;

// ---------- What both views draw: the props before, and after the chosen fixes ----------

const FACE = { 0: [0, 1], 90: [1, 0], 180: [0, -1], 270: [-1, 0] };
const floorOf = (map, x, z) => { const c = map.tiles[z]?.[x]; return c >= "1" && c <= "9" ? +c : c === "=" ? 0.1 : c === "H" ? 0.3 : 0; };

function scenes(b, map) {
  const fixes = new Map(chosen().map((f) => [f.index, f.patch]));
  const subjects = b.members.map((m) => m.index);
  const after = map.props.map((p, i) => {
    const patch = fixes.get(i);
    if (!patch) return p;
    const q = { ...p, x: patch.x ?? p.x, z: patch.z ?? p.z, rot: patch.rot ?? p.rot, y: patch.y ?? 0 };
    if (q.rot % 180 !== p.rot % 180) [q.w, q.d] = [p.d, p.w];
    return q;
  });
  const spotsAfter = map.spots.map((s, i) => {
    for (const [idx, patch] of fixes) if (patch.spots?.includes(i)) { const p = map.props[idx]; return { ...s, x: s.x + ((patch.x ?? p.x) - p.x), z: s.z + ((patch.z ?? p.z) - p.z) }; }
    return s;
  });
  // One window for both views: every member, where it stands and where it goes, with room round it; 4:3, on the map.
  const boxes = [...subjects.map((i) => map.props[i]), ...[...fixes.keys()].map((i) => after[i])];
  let x0 = Math.min(...boxes.map((p) => p.x)) - 6, x1 = Math.max(...boxes.map((p) => p.x + p.w)) + 6;
  let z0 = Math.min(...boxes.map((p) => p.z)) - 5, z1 = Math.max(...boxes.map((p) => p.z + p.d)) + 5;
  const want = Math.max(x1 - x0, (z1 - z0) * 4 / 3), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;

  [x0, x1] = slide(x0, x1, map.width); [z0, z1] = slide(z0, z1, map.height);
  return {
    view: { x0, z0, x1, z1 },
    before: { ...map, marks: subjects.map((i) => ({ p: map.props[i], colour: "#ff5c5c" })), ghosts: [] },
    after: { ...map, props: after, spots: spotsAfter, marks: subjects.map((i) => ({ p: after[i], colour: fixes.has(i) ? "#4fdf8f" : "#ff5c5c" })), ghosts: [...fixes.keys()].map((i) => map.props[i]) },

}

function draw(b, map) {
  const s = scenes(b, map), one = b.members.length === 1, n = chosen().length;

const TILE = { ".": "#4f7d39", p: "#c7a26b", r: "#9b9a93", "~": "#2f6fae", s: "#d8c58f", "=": "#8a5f37", H: "#74502f", f: "#6e4b2a", W: "#3a3c46", V: "#4a5770", "#": "#2d2f36", w: "#7d5f40" };

// ---------- 3D: the same data in blocks, at the game's angle ----------
// Terrain is a block per tile at its floor height (a digit is metres up, a boardwalk 0.1, a pier 0.3), water sits low,

const orbit = { yaw: 0, pitch: 50, zoom: 1 };

  if (k === "tree") { add(scene, shared.cyl, "#6b4a2a", cx, y + h * 0.18, cz, 0.22, h * 0.36, 0.22); return add(scene, shared.cone, COLOUR.tree, cx, y + h * 0.62, cz, Math.min(w, d) * 0.9, h * 0.76, Math.min(w, d) * 0.9); }
  if (k === "light") { add(scene, shared.cyl, "#2b2b30", cx, y + h / 2, cz, 0.09, h, 0.09); return add(scene, shared.sphere, COLOUR.light, cx, y + h, cz, 0.32, 0.32, 0.32, { emissive: "#ffcc55", emissiveIntensity: 1.2 }); }
  if (k === "plant") return add(scene, shared.sphere, COLOUR.plant, cx, y + h / 2, cz, 0.7 * w, Math.max(0.2, h), 0.7 * d);
  if (k === "rock") return add(scene, shared.rock, COLOUR.rock, cx, y + h / 2, cz, 0.8 * w, Math.max(0.3, h), 0.8 * d);
  if (k === "sign") { add(scene, shared.box, "#5b3f24", cx, y + h / 2, cz, 0.1, h, 0.1); return add(scene, shared.box, COLOUR.sign, cx + fx * 0.07, y + h * 0.78, cz + fz * 0.07, fx ? 0.05 : 0.7, h * 0.3, fz ? 0.05 : 0.7); }
  if (k === "house") {
    add(scene, shared.box, "#d9c6a4", cx, y + h * 0.3, cz, w - 0.15, h * 0.6, d - 0.15);
    const roof = add(scene, shared.roof, "#8c4a3a", cx, y + h * 0.78, cz, h * 0.42, w - 0.05, d * 0.62);
    roof.rotation.z = Math.PI / 2;
    return roof;
  }
  const box = add(scene, shared.box, COLOUR[k], cx, y + h / 2, cz, w * 0.8, h, d * 0.8);
  add(scene, shared.box, "#1b1b1f", cx + fx * w * 0.41, y + h * 0.5, cz + fz * d * 0.41, fx ? 0.04 : w * 0.4, h * 0.3, fz ? 0.04 : d * 0.4); // its face
  return box;
}

// A footprint's outline, standing from its base to its top, drawn over everything.
function frame(scene, p, colour, opacity) {
  const h = Math.max(0.3, p.tall), y = p.y ?? 0;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(p.w, h, p.d)), new THREE.LineBasicMaterial({ color: colour, transparent: true, opacity, depthTest: false }));
  edges.position.set(p.x + p.w / 2, y + h / 2, p.z + p.d / 2);
  edges.renderOrder = 10;
  scene.add(edges);
}

function aim(name) {
  const view = views[name];
  if (!view?.scene || !view.canvas.isConnected) return;
  const pitch = THREE.MathUtils.degToRad(orbit.pitch), yaw = THREE.MathUtils.degToRad(orbit.yaw), dist = view.radius * 1.15 * orbit.zoom;
  view.camera.position.set(view.centre.x + Math.sin(yaw) * Math.cos(pitch) * dist, view.centre.y + Math.sin(pitch) * dist, view.centre.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  view.camera.lookAt(view.centre);
  view.renderer.render(view.scene, view.camera);
}
const aimAll = () => Object.keys(views).forEach(aim);

function bindOrbit(canvas) {
  let drag = null;
  canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw: orbit.yaw, pitch: orbit.pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    orbit.yaw = drag.yaw - (e.clientX - drag.x) * 0.4;
    orbit.pitch = Math.min(88, Math.max(12, drag.pitch + (e.clientY - drag.y) * 0.3));
    aimAll();
  });
  canvas.addEventListener("pointerup", () => (drag = null));
  canvas.addEventListener("dblclick", () => { Object.assign(orbit, { yaw: 0, pitch: 50, zoom: 1 }); aimAll(); });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); orbit.zoom = Math.min(3, Math.max(0.25, orbit.zoom * Math.exp(e.deltaY * 0.001))); aimAll(); }, { passive: false });
}

addEventListener("resize", () => { const b = state.shown[state.at]; if (b && state.maps[b.map]) draw(b, state.maps[b.map]); });
refresh(0).catch((e) => ($("#main").innerHTML = `<p class="empty">Could not load: ${esc(e.message)}</p>`));
</script>
</body>
</html>
